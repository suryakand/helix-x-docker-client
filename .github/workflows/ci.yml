name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Unit tests and typecheck on every OS the app ships for (path handling, line endings, Windows quirks …).
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test
      - name: Release tooling tests
        run: pnpm test:scripts

  # Full check on Linux: lint, build, integration (registry:2 + Docker) and E2E.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint test build
      - name: Release tooling tests
        run: pnpm test:scripts
      - name: Integration tests (registry:2 + Docker engine)
        run: pnpm test:integration
      - name: E2E (Electron under xvfb)
        run: xvfb-run --auto-servernum pnpm --filter @helix/desktop test:e2e
