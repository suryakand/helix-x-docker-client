name: Release

# One-click release from main: Actions → Release → Run workflow.
#   1. prepare  – resolve the version and date the CHANGELOG; any resulting commit goes to a temporary
#                 release-staging/v<version> branch, NOT to main
#   2. build    – macOS / Windows / Linux installers from that exact commit
#   3. publish  – only after every build succeeded: create the tag + published GitHub Release, then bring
#                 main up to date with the release commit
#   4. bump     – only after a successful publish: move main to the next development version
#   5. cleanup  – always: delete the temporary staging branch
# If anything fails before the release is published, main is left exactly as it was (no version change).
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so the release commits cannot loop.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0 or 1.3.0-beta.1 (leave empty to release the current version in apps/desktop/package.json)'
        required: false
        default: ''
      macos:
        description: 'Build macOS installers (.dmg / .zip)'
        type: boolean
        default: true
      windows:
        description: 'Build Windows installers (setup / portable .exe)'
        type: boolean
        default: true
      linux:
        description: 'Build Linux packages (.AppImage / .deb / .tar.gz)'
        type: boolean
        default: true
      next:
        description: 'Version bump applied to main after the release'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      matrix: ${{ steps.platforms.outputs.matrix }}
      staging: ${{ steps.version.outputs.staging }}
    steps:
      - name: Selected platforms
        id: platforms
        env:
          MACOS: ${{ inputs.macos }}
          WINDOWS: ${{ inputs.windows }}
          LINUX: ${{ inputs.linux }}
        run: |
          items=()
          [ "$MACOS" = "true" ] && items+=('{"os":"macos-latest","target":"--mac"}')
          [ "$WINDOWS" = "true" ] && items+=('{"os":"windows-latest","target":"--win"}')
          [ "$LINUX" = "true" ] && items+=('{"os":"ubuntu-latest","target":"--linux"}')
          if [ ${#items[@]} -eq 0 ]; then
            echo "::error::Select at least one platform (macOS, Windows or Linux)."
            exit 1
          fi
          echo "matrix={\"include\":[$(IFS=,; echo "${items[*]}")]}" >> "$GITHUB_OUTPUT"
      - name: Releases are made from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow on the main branch (this run is on ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve version and update CHANGELOG
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version=$(node scripts/release-version.mjs set "$INPUT_VERSION")
          else
            version=$(node scripts/release-version.mjs current)
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists. Enter a new version, or bump apps/desktop/package.json."
            exit 1
          fi
          node scripts/release-version.mjs changelog-release "$version" "$(date -u +%F)"
          staging=""
          if ! git diff --quiet; then
            git commit -am "chore(release): v${version} [skip ci]"
            # Not main: main only changes once the release has actually been published.
            staging="release-staging/v${version}"
            git push --force origin "HEAD:refs/heads/${staging}"
          fi
          {
            echo "version=${version}"
            echo "sha=$(git rev-parse HEAD)"
            echo "staging=${staging}"
            echo "prerelease=$(node scripts/release-version.mjs is-prerelease "$version")"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing **v${version}** from \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    strategy:
      # Let every selected platform finish so one run shows all problems; publish still needs all of them.
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test build
      - name: Package installers
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          # Secrets that are not configured arrive as empty strings. electron-builder treats an empty CSC_LINK
          # as a certificate path and fails ("<project> not a file"), so drop empty values entirely.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::notice::No signing certificate configured (CSC_LINK); building unsigned installers."
          fi
          pnpm exec electron-builder "$TARGET" --publish never
        env:
          TARGET: ${{ matrix.target }}
          # Optional code signing / notarization: leave these secrets unset for unsigned builds.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.deb
            apps/desktop/release/*/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          node scripts/release-version.mjs notes "$VERSION" > notes.md
          if [ ! -s notes.md ]; then echo "Helix-X Docker Client ${VERSION}" > notes.md; fi
          if [ "$PRERELEASE" = "true" ]; then channel=--prerelease; else channel=--latest; fi
          # The tag is created here, at the built commit, so a failed build never leaves a tag behind.
          # --notes is prepended to GitHub's generated notes (commits / PRs since the previous release).
          gh release create "v${VERSION}" dist/* \
            --target "$SHA" \
            --title "Helix-X Docker Client v${VERSION}" \
            --notes "$(cat notes.md)" \
            --generate-notes \
            "$channel"
          url=$(gh release view "v${VERSION}" --json url --jq .url)
          {
            echo "### Released [v${VERSION}](${url})"
            echo
            echo "| Installer | Size |"
            echo "| --- | --- |"
            for f in dist/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update main with the release commit
        if: needs.prepare.outputs.staging != ''
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor origin/main "$SHA"; then
            git push origin "${SHA}:refs/heads/main"   # fast-forward: main has not moved
          else
            # main moved while the installers were building: merge the release commit in.
            git checkout -B main origin/main
            git merge --no-edit -m "chore(release): merge v${VERSION} into main [skip ci]" "$SHA"
            git push origin HEAD:main
          fi

  bump:
    needs: [prepare, publish]
    # Never move main to the next version unless the release was really published.
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the next development version on main
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LEVEL: ${{ inputs.next }}
        run: |
          set -euo pipefail
          next=$(node scripts/release-version.mjs next "$LEVEL" "$VERSION")
          node scripts/release-version.mjs set "$next"
          git commit -am "chore: start v${next} development [skip ci]"
          # main may have moved while the installers were building.
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
          echo "main is now at **v${next}**" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: [prepare, build, publish, bump]
    if: always() && needs.prepare.outputs.staging != ''
    runs-on: ubuntu-latest
    steps:
      - name: Delete the temporary release-staging branch
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING: ${{ needs.prepare.outputs.staging }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${STAGING}" \
            && echo "Deleted ${STAGING}" \
            || echo "::warning::Could not delete ${STAGING}; delete it by hand."
